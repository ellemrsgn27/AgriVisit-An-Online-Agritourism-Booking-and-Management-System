<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AgriVisit</title>
    <script>
      // GitHub Pages sends unknown addresses here. Keep the address in the
      // link and send the visitor to the home page, which opens the right screen.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
